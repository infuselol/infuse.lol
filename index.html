<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Infuse.lol</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  :root {
    --red: #ff3333;
    --red-glow: rgba(255,51,51,0.4);
    --red-dim: rgba(255,51,51,0.15);
    --red-subtle: rgba(255,51,51,0.06);
    --surface: rgba(255,255,255,0.02);
    --border: rgba(255,51,51,0.15);
    --text-muted: #444;
    --text-dim: #2a2a2a;
  }

  /* ── Layout ── */
  .page-content {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding-bottom: 60px;
  }

  /* ── Background grid ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,51,51,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,51,51,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(255,51,51,0.06) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }
  .page-content, nav { position: relative; z-index: 1; }

  /* ── Clock ── */
  .clock-wrapper {
    margin-bottom: 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeUp 0.5s 0.1s cubic-bezier(0.22,1,0.36,1) both;
  }
  .clock-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 3.4rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    background: linear-gradient(180deg, #fff 0%, #888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 24px rgba(255,51,51,0.2));
  }
  .clock-colon { color: var(--red); -webkit-text-fill-color: var(--red); opacity: .5; }
  .clock-seconds { -webkit-text-fill-color: var(--red); font-size: 2.2rem; opacity: .6; }
  .clock-ampm { -webkit-text-fill-color: var(--red); font-size: 1.1rem; margin-left: .5rem; font-weight: 500; opacity: .75; }
  .clock-date {
    font-size: .78rem; color: var(--text-muted);
    margin-top: .5rem; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase;
  }
  .clock-tz {
    font-size: .6rem; color: var(--text-dim);
    margin-top: .2rem; letter-spacing: .22em; text-transform: uppercase;
  }

  /* ── Logo ── */
  .logo-wrap {
    margin-bottom: 2.5rem;
    animation: fadeUp 0.5s 0.2s cubic-bezier(0.22,1,0.36,1) both;
  }
  .logo {
    font-size: 7rem; font-weight: 900;
    letter-spacing: -0.02em; line-height: 1;
  }
  .infuse {
    color: var(--red);
    text-shadow: 0 0 12px var(--red-glow), 0 0 35px var(--red-dim);
    transition: all .3s; cursor: pointer; display: inline-block;
  }
  .infuse:hover { transform: translateY(-8px) scale(1.06); text-shadow: 0 0 22px rgba(255,51,51,0.7), 0 0 50px rgba(255,51,51,0.3); }
  .lol {
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.15);
    transition: all .3s; cursor: pointer; display: inline-block;
  }
  .lol:hover { transform: translateY(-8px) scale(1.06); }

  /* ── Socials box ── */
  .socials-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    width: 340px; height: 100px;
    overflow: hidden;
    box-shadow: 0 0 40px var(--red-subtle);
    backdrop-filter: blur(10px);
    scrollbar-width: none;
    animation: fadeUp 0.5s 0.3s cubic-bezier(0.22,1,0.36,1) both;
  }
  .socials-box::-webkit-scrollbar { display: none; }
  .socials-scroll {
    display: flex; flex-direction: column;
    animation: scrollUp 10s linear infinite;
    pointer-events: none;
  }
  .socials-scroll.paused { animation-play-state: paused; }
  .social-item {
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    gap: .75rem; padding: 1.6rem 2rem; min-height: 100px;
    transition: all .25s; cursor: pointer;
  }
  .social-item:hover { background: rgba(255,51,51,0.07); }
  .social-icon { width: 20px; height: 20px; flex-shrink: 0; }
  .social-text { color: #888; font-size: .9rem; font-weight: 500; }
  @keyframes scrollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-300px); } }

  /* ── Section divider ── */
  .section-divider {
    display: flex; align-items: center; gap: 16px;
    width: 100%; max-width: 640px;
    margin: 3rem 0 1.8rem;
    animation: fadeUp 0.5s 0.4s cubic-bezier(0.22,1,0.36,1) both;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,51,51,0.15), transparent);
  }
  .section-label {
    font-size: .65rem; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase;
    color: #333;
  }

  /* ── Tools grid ── */
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width: 100%; max-width: 640px;
    animation: fadeUp 0.5s 0.45s cubic-bezier(0.22,1,0.36,1) both;
  }
  .tool-card {
    background: var(--surface);
    border: 1.5px solid rgba(255,255,255,0.05);
    border-radius: 14px;
    padding: 18px 20px;
    cursor: pointer;
    text-decoration: none;
    display: flex; align-items: center; gap: 14px;
    transition: all .25s;
    position: relative;
    overflow: hidden;
  }
  .tool-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,51,51,0.06), transparent 60%);
    opacity: 0;
    transition: opacity .25s;
  }
  .tool-card:hover {
    border-color: rgba(255,51,51,0.25);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(255,51,51,0.06);
  }
  .tool-card:hover::before { opacity: 1; }
  .tool-card.featured {
    border-color: rgba(255,51,51,0.2);
    box-shadow: 0 0 30px rgba(255,51,51,0.06);
  }
  .tool-icon {
    width: 40px; height: 40px; flex-shrink: 0;
    background: rgba(255,51,51,0.08);
    border: 1px solid rgba(255,51,51,0.15);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .tool-icon svg { width: 18px; height: 18px; }
  .tool-info { flex: 1; min-width: 0; }
  .tool-name {
    font-size: .88rem; font-weight: 700;
    color: #ddd; letter-spacing: -.01em;
    margin-bottom: 3px;
  }
  .tool-desc { font-size: .72rem; color: #444; line-height: 1.4; }
  .tool-badge {
    font-size: .58rem; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--red); background: rgba(255,51,51,0.1);
    border: 1px solid rgba(255,51,51,0.2);
    border-radius: 4px; padding: 2px 6px;
    flex-shrink: 0;
  }

  /* ── Copy notification ── */
  .copy-notification {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: rgba(10,10,10,0.95);
    border: 1.5px solid rgba(255,51,51,0.25);
    border-radius: 10px;
    padding: 10px 20px;
    font-size: .8rem; font-weight: 600;
    color: #fff; letter-spacing: .04em;
    opacity: 0; pointer-events: none;
    transition: all .25s;
    backdrop-filter: blur(12px);
    z-index: 9999;
  }
  .copy-notification.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Responsive ── */
  @media (max-width: 680px) {
    .tools-grid { max-width: 100%; padding: 0 16px; }
    .section-divider { max-width: 100%; padding: 0 16px; }
  }
  @media (max-width: 500px) {
    .logo { font-size: 3.8rem; }
    .clock-time { font-size: 2.2rem; }
    .clock-seconds { font-size: 1.4rem; }
    .clock-ampm { font-size: .9rem; }
    .socials-box { width: 92vw; }
    .tools-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 380px) {
    .logo { font-size: 3rem; }
    .clock-time { font-size: 1.8rem; }
  }
</style>
</head>

<script>
// ── Clock ──
function updateClock() {
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clockTime').innerHTML =
    `${h}<span class="clock-colon">:</span>${String(m).padStart(2,'0')}<span class="clock-seconds">:${String(s).padStart(2,'0')}</span><span class="clock-ampm">${ampm}</span>`;
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('clockDate').textContent =
    `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
}
updateClock();
setInterval(updateClock, 1000);

// ── Socials scroll + copy ──
const scroll = document.getElementById('socialsScroll');
document.querySelectorAll('.social-item').forEach(item => scroll.appendChild(item.cloneNode(true)));

const box = document.getElementById('socialsBox');
box.addEventListener('mouseenter', () => scroll.classList.add('paused'));
box.addEventListener('mouseleave', () => scroll.classList.remove('paused'));

function showCopyNote() {
  const n = document.getElementById('copyNotification');
  n.classList.add('show');
  setTimeout(() => n.classList.remove('show'), 2000);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showCopyNote);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showCopyNote(); } catch(e) {}
    document.body.removeChild(ta);
  }
}

document.querySelectorAll('.social-item').forEach(item => {
  item.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    copyText(item.querySelector('.social-text').textContent);
  });
});
</script>
